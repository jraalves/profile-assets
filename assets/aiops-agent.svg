<text x="32.0" y="42.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">O agente que calcula MTTR antes de eu abrir o notebook</text><text x="32.0" y="64.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">plataforma interna ligada em observabilidade, tickets, deploy e cluster &#183; nada escreve em produ&#231;&#227;o sem aprova&#231;&#227;o humana</text><text x="32.0" y="92.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">fontes por tag de aplicacao</text><rect x="32" y="104" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="124.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">Dynatrace / Davis AI</text><path d="M228,119 C 258,119 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="32" y="142" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="162.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">OpenTelemetry</text><path d="M228,157 C 258,157 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="32" y="180" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="200.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">Jira</text><path d="M228,195 C 258,195 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="32" y="218" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="238.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">ArgoCD</text><path d="M228,233 C 258,233 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="32" y="256" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="276.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">GitLab</text><path d="M228,271 C 258,271 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="32" y="294" width="196" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".5"/><text x="46.0" y="314.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#58a6ff">Kubernetes</text><path d="M228,309 C 258,309 258,232 280,232" fill="none" stroke="#30363d" stroke-opacity=".8"/><rect x="296" y="104" width="448" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="296" y="104" width="4" height="60" rx="2" fill="#f778ba"/><text x="312.0" y="126.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#f778ba">1. correla&#231;&#227;o</text><text x="312.0" y="144.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">mesmo correlation id entre Linux e legado</text><text x="312.0" y="158.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">regra de arco, n&#227;o threshold fixo</text><path d="M520,164 l0,8" stroke="#30363d" stroke-width="2" marker-end="url(#arr)"/><rect x="296" y="172" width="448" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="296" y="172" width="4" height="60" rx="2" fill="#39c5cf"/><text x="312.0" y="194.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#39c5cf">2. enriquecimento</text><text x="312.0" y="212.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">deploy recente, historico do servico,</text><text x="312.0" y="226.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">runbook aplicavel e quem esta de plantao</text><path d="M520,232 l0,8" stroke="#30363d" stroke-width="2" marker-end="url(#arr)"/><rect x="296" y="240" width="448" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="296" y="240" width="4" height="60" rx="2" fill="#d29922"/><text x="312.0" y="262.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#d29922">3. veredito</text><text x="312.0" y="280.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">categoria + runbook + confianca;</text><text x="312.0" y="294.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">abaixo do limiar vira 'preciso de humano'</text><path d="M520,300 l0,8" stroke="#30363d" stroke-width="2" marker-end="url(#arr)"/><rect x="296" y="308" width="448" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="296" y="308" width="4" height="60" rx="2" fill="#3fb950"/><text x="312.0" y="330.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#3fb950">4. acao com gate</text><text x="312.0" y="348.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">dry-run, idempotencia, kill switch,</text><text x="312.0" y="362.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">auditoria e aprova&#231;&#227;o obrigatoria</text><path d="M520,368 l0,8" stroke="#30363d" stroke-width="2" marker-end="url(#arr)"/><rect x="296" y="376" width="448" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="296" y="376" width="4" height="60" rx="2" fill="#bc8cff"/><text x="312.0" y="398.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#bc8cff">5. medida</text><text x="312.0" y="416.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">MTTR, recorr&#234;ncia por componente,</text><text x="312.0" y="430.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">cobertura propria e custo por triagem</text><rect x="776" y="104" width="472" height="348" rx="10" fill="#161b22" stroke="#30363d"/><text x="794.0" y="132.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#58a6ff">avalia&#231;&#227;o contra gabarito &#183; 79 incidentes sinteticos</text><text x="794.0" y="160.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">acuracia de categoria</text><rect x="794" y="168" width="376" height="16" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="794" y="168" width="338.0" height="16" rx="8" fill="#3fb950" fill-opacity=".85"><animate attributeName="width" values="0;338.0" dur=".9s" begin="0.40s" fill="freeze"/></rect><text x="1230.0" y="181.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3fb950">89,9%</text><text x="794.0" y="206.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">acuracia de runbook</text><rect x="794" y="214" width="376" height="16" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="794" y="214" width="285.8" height="16" rx="8" fill="#39c5cf" fill-opacity=".85"><animate attributeName="width" values="0;285.8" dur=".9s" begin="0.65s" fill="freeze"/></rect><text x="1230.0" y="227.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#39c5cf">76,0%</text><text x="794.0" y="252.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">macro F1</text><rect x="794" y="260" width="376" height="16" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="794" y="260" width="266.6" height="16" rx="8" fill="#bc8cff" fill-opacity=".85"><animate attributeName="width" values="0;266.6" dur=".9s" begin="0.90s" fill="freeze"/></rect><text x="1230.0" y="273.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#bc8cff">0,709</text><text x="794.0" y="298.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">baseline classe majoritaria</text><rect x="794" y="306" width="376" height="16" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="794" y="306" width="123.7" height="16" rx="8" fill="#d29922" fill-opacity=".85"><animate attributeName="width" values="0;123.7" dur=".9s" begin="1.15s" fill="freeze"/></rect><text x="1230.0" y="319.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#d29922">32,9%</text><line x1="794" y1="346" x2="1230" y2="346" stroke="#30363d"/><text x="794.0" y="364.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">o numero que decide se o agente entra:</text><text x="794.0" y="379.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">ganho sobre baseline = 89,9% - 32,9% = +57,0 pp</text><text x="794.0" y="394.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">custo por triagem e latencia ainda em medicao</text><text x="794.0" y="409.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#f85149">se custar mais que o toil que evita, nao entra</text><text x="794.0" y="424.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">no lab o modelo e um stub deterministico;</text><text x="794.0" y="439.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#e6edf3">--modelo http e o ponto de entrada real.</text><text x="32.0" y="456.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">Sem baseline, "89,9% de acuracia" nao significa nada. O dado e rotulado como sintetico de proposito: qualquer pessoa reproduce sem dado de cliente.</text>
</svg>
