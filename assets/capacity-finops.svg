<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Projecao de headroom com faixa de sensibilidade, data de esgotamento, custo de escalar cedo ou tarde e o preco do recurso sem tag.">
<title>Capacity planning e FinOps na mesma conversa</title><desc>Projecao de headroom com faixa de sensibilidade, data de esgotamento, custo de escalar cedo ou tarde e o preco do recurso sem tag.</desc>
