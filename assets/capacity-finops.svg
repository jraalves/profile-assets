<text x="32.0" y="42.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Capacidade: a decisão barata tem data, não feeling</text><text x="32.0" y="64.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">serie sintetica do lab-06 com sazonalidade de fechamento de ciclo &#183; faixa de &#177;25% na demanda &#183; nao e cota&#231;&#227;o de ninguem</text><rect x="32" y="96" width="612" height="300" rx="10" fill="#161b22" stroke="#30363d"/><text x="48.0" y="122.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">demanda projetada &#215; capacidade contratada</text><polygon points="84.0,263.2 124.6,253.5 165.2,243.8 205.8,219.8 246.5,224.3 287.1,214.6 327.7,204.8 368.3,180.8 408.9,185.3 449.5,175.6 490.2,165.9 530.8,141.9 571.4,146.4 612.0,136.7 612.0,219.6 571.4,225.4 530.8,222.7 490.2,237.1 449.5,243.0 408.9,248.8 368.3,246.1 327.7,260.5 287.1,266.3 246.5,272.2 205.8,269.5 165.2,283.9 124.6,289.7 84.0,295.6" fill="#58a6ff" fill-opacity=".12"/><line x1="84" y1="163.5" x2="612.0" y2="163.5" stroke="#f85149" stroke-dasharray="6 4"/><text x="84.0" y="156.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#f85149">capacidade contratada (limite fisico do plano)</text><polyline points="84.0,279.4 124.6,271.6 165.2,263.8 205.8,244.6 246.5,248.2 287.1,240.4 327.7,232.7 368.3,213.5 408.9,217.1 449.5,209.3 490.2,201.5 530.8,182.3 571.4,185.9 612.0,178.1" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="1400"><animate attributeName="stroke-dashoffset" values="1400;0;0" dur="2.6s" begin="0.4s" fill="freeze" repeatCount="indefinite"/></polyline><circle cx="84.0" cy="279.4" r="2.6" fill="#58a6ff"/><circle cx="124.6" cy="271.6" r="2.6" fill="#58a6ff"/><circle cx="165.2" cy="263.8" r="2.6" fill="#58a6ff"/><circle cx="205.8" cy="244.6" r="2.6" fill="#58a6ff"/><circle cx="246.5" cy="248.2" r="2.6" fill="#58a6ff"/><circle cx="287.1" cy="240.4" r="2.6" fill="#58a6ff"/><circle cx="327.7" cy="232.7" r="2.6" fill="#58a6ff"/><circle cx="368.3" cy="213.5" r="2.6" fill="#58a6ff"/><circle cx="408.9" cy="217.1" r="2.6" fill="#58a6ff"/><circle cx="449.5" cy="209.3" r="2.6" fill="#58a6ff"/><circle cx="490.2" cy="201.5" r="2.6" fill="#58a6ff"/><circle cx="530.8" cy="182.3" r="2.6" fill="#58a6ff"/><circle cx="571.4" cy="185.9" r="2.6" fill="#58a6ff"/><circle cx="612.0" cy="178.1" r="2.6" fill="#58a6ff"/><line x1="530.8" y1="136" x2="530.8" y2="344" stroke="#d29922" stroke-dasharray="4 4"/><text x="516.8" y="362.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#d29922">dia D &#183; esgotamento</text><text x="516.8" y="376.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" text-anchor="end" fill="#8b949e">com a faixa: D-6 a D+9</text><text x="48.0" y="388.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">semana 1 a semana 14 &#183; pico a cada 4 semanas (fechamento) &#183; headroom hoje: 18%</text><text x="676.0" y="88.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">o que cada escolha custa</text><rect x="676" y="96" width="288" height="82" rx="10" fill="#161b22" stroke="#30363d"/><rect x="676" y="96" width="4" height="82" rx="2" fill="#3fb950"/><text x="692.0" y="118.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#3fb950">escalar cedo</text><text x="692.0" y="136.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; +1 faixa por 6 semanas</text><text x="692.0" y="150.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; risco de ocioso: 2 semanas</text><text x="692.0" y="164.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; decisao cabe num sprint</text><rect x="676" y="188" width="288" height="82" rx="10" fill="#161b22" stroke="#30363d"/><rect x="676" y="188" width="4" height="82" rx="2" fill="#f85149"/><text x="692.0" y="210.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#f85149">esperar o dia D</text><text x="692.0" y="228.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; compra sob pressao</text><text x="692.0" y="242.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; overprovision de 40%</text><text x="692.0" y="256.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; degradacao no pico real</text><rect x="676" y="280" width="288" height="82" rx="10" fill="#161b22" stroke="#30363d"/><rect x="676" y="280" width="4" height="82" rx="2" fill="#d29922"/><text x="692.0" y="302.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#d29922">autoescala pura</text><text x="692.0" y="320.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; reage a sintoma</text><text x="692.0" y="334.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; pega o fechamento frio</text><text x="692.0" y="348.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; serve de complemento</text><rect x="996" y="96" width="252" height="276" rx="10" fill="#161b22" stroke="#30363d"/><text x="1012.0" y="122.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#bc8cff">FinOps: o preco do sem tag</text><text x="1012.0" y="152.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">recursos com tag valida</text><text x="1012.0" y="172.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">78%</text><text x="1012.0" y="196.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">custo inefavel no mes</text><text x="1012.0" y="216.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">R$ 41,3 mil</text><text x="1012.0" y="240.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">realocavel sem compra</text><text x="1012.0" y="260.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">R$ 12,8 mil</text><text x="1012.0" y="284.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">ocioso com p95 abaixo de 20%</text><text x="1012.0" y="304.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">R$ 8,9 mil</text><text x="1012.0" y="328.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">anomalia por z-score</text><text x="1012.0" y="348.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">2 casos</text><text x="1012.0" y="360.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#8b949e">premissas no topo do lab-07</text><text x="32.0" y="456.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">Capacity e FinOps sao a mesma reuniao quando a pergunta e: o que eu deixo de fazer hoje para nao comprar sob pressao em 6 semanas.</text>
</svg>
