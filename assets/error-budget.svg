<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Do SLO ao budget em minutos, consumo acumulado, os dois janelamentos de burn rate e quatro estados de gate.">
<title>Error budget como politica de release</title><desc>Do SLO ao budget em minutos, consumo acumulado, os dois janelamentos de burn rate e quatro estados de gate.</desc>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset=".5" stop-color="#bc8cff" stop-opacity=".14"/><stop offset="1" stop-color="#39c5cf" stop-opacity=".18"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#30363d"/></marker>
</defs>
<rect width="1280" height="470" rx="14" fill="#0d1117"/>
<rect x=".5" y=".5" width="1279" height="469" rx="13.5" fill="none" stroke="#30363d"/>
<text x="32.0" y="42.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Error budget não é humor: é política com matemática</text><text x="32.0" y="64.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">SLO 99,9% num mes de 30 dias &#183; budget = 0,1% &#215; 43.200 min = 43,2 min &#183; consumo do lab-01 com dados sinteticos</text><rect x="32" y="92" width="292" height="188" rx="10" fill="#161b22" stroke="#30363d"/><text x="48.0" y="118.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">a conta que todo mundo deveria ver</text><text x="48.0" y="148.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">budget mensal</text><text x="308.0" y="148.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#3fb950">43,2 min</text><text x="48.0" y="182.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">consumido ate aqui</text><text x="308.0" y="182.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#d29922">6,5 min (15%)</text><text x="48.0" y="216.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">restante</text><text x="308.0" y="216.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#e6edf3">36,7 min</text><text x="48.0" y="250.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">se queimar a 2/min</text><text x="308.0" y="250.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#f85149">acaba em 18 min</text><text x="48.0" y="266.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">sem denominador, o numero e adjetivo</text><rect x="356" y="92" width="348" height="188" rx="10" fill="#161b22" stroke="#30363d"/><text x="372.0" y="118.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">consumo acumulado &#215; tempo</text><line x1="408" y1="242.0" x2="680.0" y2="242.0" stroke="#30363d" stroke-opacity=".5" stroke-dasharray="2 5"/><text x="402.0" y="246.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" text-anchor="end" fill="#8b949e">0%</text><line x1="408" y1="186.0" x2="680.0" y2="186.0" stroke="#30363d" stroke-opacity=".5" stroke-dasharray="2 5"/><text x="402.0" y="190.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" text-anchor="end" fill="#8b949e">50%</text><line x1="408" y1="130.0" x2="680.0" y2="130.0" stroke="#30363d" stroke-opacity=".5" stroke-dasharray="2 5"/><text x="402.0" y="134.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" text-anchor="end" fill="#8b949e">100%</text><line x1="408" y1="242" x2="680.0" y2="242" stroke="#30363d"/><line x1="408" y1="186.0" x2="680.0" y2="186.0" stroke="#f85149" stroke-opacity=".5" stroke-dasharray="5 4"/><polyline points="408.0,236.4 440.6,231.9 473.3,227.4 497.8,225.2 530.4,203.9 549.4,180.4 576.6,172.6 609.3,162.5 641.9,147.9 680.0,133.4" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="900"><animate attributeName="stroke-dashoffset" values="900;0;0" dur="3s" begin="0.4s" fill="freeze" repeatCount="indefinite"/></polyline><circle cx="408.0" cy="236.4" r="2.4" fill="#d29922"/><circle cx="440.6" cy="231.9" r="2.4" fill="#d29922"/><circle cx="473.3" cy="227.4" r="2.4" fill="#d29922"/><circle cx="497.8" cy="225.2" r="2.4" fill="#d29922"/><circle cx="530.4" cy="203.9" r="2.4" fill="#d29922"/><circle cx="549.4" cy="180.4" r="2.4" fill="#d29922"/><circle cx="576.6" cy="172.6" r="2.4" fill="#d29922"/><circle cx="609.3" cy="162.5" r="2.4" fill="#d29922"/><circle cx="641.9" cy="147.9" r="2.4" fill="#d29922"/><circle cx="680.0" cy="133.4" r="2.4" fill="#d29922"/><text x="408.0" y="266.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">dia 1</text><text x="680.0" y="266.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" text-anchor="end" fill="#8b949e">dia 30</text><text x="680.0" y="180.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="end" fill="#f85149">metade do budget: alerta de padrao</text><text x="736.0" y="84.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">estados do portao &#183; multi-window, multi-burn-rate</text><rect x="736" y="96" width="512" height="84" rx="10" fill="#161b22" stroke="#30363d"/><rect x="736" y="96" width="4" height="84" rx="2" fill="#3fb950"/><text x="752.0" y="118.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#3fb950">LIBERADO</text><text x="1232.0" y="118.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#8b949e">burn sob controle</text><text x="752.0" y="138.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; &lt; 1x nas duas janelas</text><text x="1002.0" y="138.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; release segue normal</text><text x="752.0" y="153.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; ninguem pede aprovacao</text><text x="752.0" y="172.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#3fb950">quem decide: time</text><rect x="736" y="186" width="512" height="84" rx="10" fill="#161b22" stroke="#30363d"/><rect x="736" y="186" width="4" height="84" rx="2" fill="#d29922"/><text x="752.0" y="208.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#d29922">CONGELAMENTO PARCIAL</text><text x="1232.0" y="208.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#8b949e">queima acelerada</text><text x="752.0" y="228.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; &#8805; 14,4x em 5m/1h por 5 min</text><text x="1002.0" y="228.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; &#8805; 6x em 6h/3d por 30 min</text><text x="752.0" y="243.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; canario so com assinatura</text><text x="752.0" y="262.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#d29922">quem decide: EM + tech lead</text><rect x="736" y="276" width="512" height="84" rx="10" fill="#161b22" stroke="#30363d"/><rect x="736" y="276" width="4" height="84" rx="2" fill="#f85149"/><text x="752.0" y="298.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#f85149">CONGELADO</text><text x="1232.0" y="298.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#8b949e">budget a acabar</text><text x="752.0" y="318.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; &#8805; 2x rapido E &#8805; 1x lento</text><text x="1002.0" y="318.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; feature proibida</text><text x="752.0" y="333.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; correcao, rollback, escala</text><text x="752.0" y="352.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#f85149">quem decide: EM com registro</text><rect x="736" y="366" width="512" height="84" rx="10" fill="#161b22" stroke="#30363d"/><rect x="736" y="366" width="4" height="84" rx="2" fill="#58a6ff"/><text x="752.0" y="388.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#58a6ff">RECOVERY / RESET</text><text x="1232.0" y="388.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#8b949e">budget voltando</text><text x="752.0" y="408.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; janela lenta voltou pra baixo</text><text x="1002.0" y="408.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; post-mortem publicado</text><text x="752.0" y="423.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e6edf3">&#183; regra revista com produto</text><text x="752.0" y="442.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#58a6ff">quem decide: SRE + produto</text><text x="32.0" y="456.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">Por que duas janelas: a rapida pega incidente em curso, a lenta pega degrada&#231;&#227;o silenciosa. So a rapida pune spike; so a lenta &#233; lenta demais para barrear release ruim.</text>
</svg>
