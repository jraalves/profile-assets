<text x="32.0" y="42.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Anatomia de incidente: onde mora o tempo que ninguém recupera</text><text x="32.0" y="64.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">largura &#8733; duracao real da fase &#183; a janela introduced&#8594;detected &#233; produto de arquitetura, n&#227;o de esfor&#231;o de plant&#227;o</text><line x1="190" y1="96" x2="190" y2="312" stroke="#30363d"/><text x="176.0" y="119.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#58a6ff">introduced</text><rect x="190.0" y="104" width="95.3" height="22" rx="4" fill="#58a6ff" fill-opacity=".82"><title>introduced: 22 min</title><animate attributeName="width" values="0;95.3" dur=".7s" begin="0.00s" fill="freeze"/></rect><text x="237.7" y="119.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d1117">22 min</text><text x="784.0" y="119.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">deploy entra com bug de cardinalidade</text><text x="1248.0" y="119.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#58a6ff">dev + CD</text><text x="176.0" y="155.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#f778ba">detected</text><rect x="285.3" y="140" width="60.7" height="22" rx="4" fill="#f778ba" fill-opacity=".82"><title>detected: 14 min</title><animate attributeName="width" values="0;60.7" dur=".7s" begin="0.12s" fill="freeze"/></rect><text x="315.7" y="155.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d1117">14 min</text><text x="784.0" y="155.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">alerta por arco no p95 da jornada</text><text x="1248.0" y="155.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#f778ba">SRE</text><text x="176.0" y="191.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#39c5cf">acknowledged</text><rect x="346.0" y="176" width="30.3" height="22" rx="4" fill="#39c5cf" fill-opacity=".82"><title>acknowledged: 7 min</title><animate attributeName="width" values="0;30.3" dur=".7s" begin="0.24s" fill="freeze"/></rect><text x="383.3" y="191.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#39c5cf">7 min</text><text x="784.0" y="191.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">triagem do agente, humano assume</text><text x="1248.0" y="191.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#39c5cf">on-call</text><text x="176.0" y="227.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#3fb950">mitigated</text><rect x="376.3" y="212" width="112.7" height="22" rx="4" fill="#3fb950" fill-opacity=".82"><title>mitigated: 26 min</title><animate attributeName="width" values="0;112.7" dur=".7s" begin="0.36s" fill="freeze"/></rect><text x="432.7" y="227.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d1117">26 min</text><text x="784.0" y="227.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">rollback no ArgoCD + feature flag</text><text x="1248.0" y="227.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#3fb950">on-call</text><text x="176.0" y="263.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#d29922">resolved</text><rect x="489.0" y="248" width="47.7" height="22" rx="4" fill="#d29922" fill-opacity=".82"><title>resolved: 11 min</title><animate attributeName="width" values="0;47.7" dur=".7s" begin="0.48s" fill="freeze"/></rect><text x="512.8" y="263.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d1117">11 min</text><text x="784.0" y="263.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">jornada de volta dentro do SLO</text><text x="1248.0" y="263.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#d29922">SRE</text><text x="176.0" y="299.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#bc8cff">learned</text><rect x="536.7" y="284" width="173.3" height="22" rx="4" fill="#bc8cff" fill-opacity=".82"><title>learned: 40 min</title><animate attributeName="width" values="0;173.3" dur=".7s" begin="0.60s" fill="freeze"/></rect><text x="623.3" y="299.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d1117">40 min</text><text x="784.0" y="299.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">RCA com dono, prazo e regra nova</text><text x="1248.0" y="299.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#bc8cff">produto + SRE</text><line x1="190" y1="316" x2="710" y2="316" stroke="#30363d" stroke-width="2"/><text x="784.0" y="310.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">quem segura o microfone na fase</text><text x="1248.0" y="310.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="end" fill="#8b949e">dono</text><text x="32.0" y="346.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#58a6ff">metricas derivadas da mesma linha do tempo &#183; MTTL = tempo ate a mudanca estrutural sair do post-mortem</text><rect x="32" y="358" width="234" height="62" rx="10" fill="#161b22" stroke="#30363d"/><rect x="32" y="358" width="4" height="62" rx="2" fill="#f778ba"/><text x="48.0" y="382.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#f778ba">MTTD</text><text x="250.0" y="386.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e6edf3">14 min</text><text x="48.0" y="404.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">ate o alarme tocar</text><rect x="282" y="358" width="234" height="62" rx="10" fill="#161b22" stroke="#30363d"/><rect x="282" y="358" width="4" height="62" rx="2" fill="#39c5cf"/><text x="298.0" y="382.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#39c5cf">MTTA</text><text x="500.0" y="386.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e6edf3">7 min</text><text x="298.0" y="404.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">ate alguem assumir</text><rect x="532" y="358" width="234" height="62" rx="10" fill="#161b22" stroke="#30363d"/><rect x="532" y="358" width="4" height="62" rx="2" fill="#3fb950"/><text x="548.0" y="382.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#3fb950">MTTM</text><text x="750.0" y="386.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e6edf3">26 min</text><text x="548.0" y="404.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">ate a jornada voltar</text><rect x="782" y="358" width="234" height="62" rx="10" fill="#161b22" stroke="#30363d"/><rect x="782" y="358" width="4" height="62" rx="2" fill="#d29922"/><text x="798.0" y="382.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#d29922">MTTR</text><text x="1000.0" y="386.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e6edf3">47 min</text><text x="798.0" y="404.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">detected &#8594; resolved</text><rect x="1032" y="358" width="234" height="62" rx="10" fill="#161b22" stroke="#30363d"/><rect x="1032" y="358" width="4" height="62" rx="2" fill="#bc8cff"/><text x="1048.0" y="382.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#bc8cff">MTTL</text><text x="1250.0" y="386.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e6edf3">40 min</text><text x="1048.0" y="404.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">ate o sistema mudar</text><text x="32.0" y="456.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">CV (Meta/Tokio Marine, 2023): -50% no tempo de resposta e -70% no de detecc&#227;o, medidos com a area. As duracoes acima v&#234;m do lab-03, com dados sinteticos.</text>
