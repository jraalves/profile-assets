<rect x="32" y="466" width="1216" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="48.0" y="490.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.6" fill="#8b949e">NetworkPolicy: o namespace nega todo egress/ingress que nao esteja listado &#183; Secret montado como volume, nunca como .env no Git &#183; os numeros desta</text>
<text x="48.0" y="510.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.6" fill="#8b949e">pagina vem de ambiente de laboratorio &#183; a URL ilustrativa nao aponta para ambiente de cliente, que nao tem endpoint na internet</text>
