<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Diagrama do caminho do código até a produção com realce do erro de orçamento e volta ao Git.">
<title>Pipeline GitOps com feedback de observabilidade</title><desc>Diagrama do caminho do código até a produção com realce do erro de orçamento e volta ao Git.</desc>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset=".5" stop-color="#bc8cff" stop-opacity=".14"/><stop offset="1" stop-color="#39c5cf" stop-opacity=".18"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="420" rx="14" fill="#0d1117"/>
<rect x=".5" y=".5" width="1279" height="419" rx="13.5" fill="none" stroke="#30363d"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker></defs><text x="32" y="42" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Pipeline: do commit ao signal</text><text x="32" y="64" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">GitOps end-to-end &#183; a seta tracejada é o caminho que fecha o loop &#8594; sem ela, automação sem evidência</text><rect x="32" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><rect x="32" y="96" width="178" height="4" rx="2" fill="#58a6ff"/><text x="46" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Developer</text><text x="46" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">git push</text><circle cx="51" cy="178" r="2.5" fill="#58a6ff" opacity=".8"/><text x="62" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">feature branch</text><circle cx="51" cy="200" r="2.5" fill="#58a6ff" opacity=".8"/><text x="62" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">conventional commit</text><path d="M214 180.0 h12" stroke="#30363d" stroke-width="2" marker-end="url(#ar)"/><rect x="234" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/><rect x="234" y="96" width="178" height="4" rx="2" fill="#bc8cff"/><text x="248" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#bc8cff">CI</text><text x="248" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">GitLab / Actions</text><circle cx="253" cy="178" r="2.5" fill="#bc8cff" opacity=".8"/><text x="264" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">lint + unit</text><circle cx="253" cy="200" r="2.5" fill="#bc8cff" opacity=".8"/><text x="264" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">contract test</text><circle cx="253" cy="222" r="2.5" fill="#bc8cff" opacity=".8"/><text x="264" y="226" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">SBOM</text><path d="M416 180.0 h12" stroke="#30363d" stroke-width="2" marker-end="url(#ar)"/><rect x="436" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><rect x="436" y="96" width="178" height="4" rx="2" fill="#d29922"/><text x="450" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#d29922">Artifact</text><text x="450" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">sign + attest</text><circle cx="455" cy="178" r="2.5" fill="#d29922" opacity=".8"/><text x="466" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">cosign sign</text><circle cx="455" cy="200" r="2.5" fill="#d29922" opacity=".8"/><text x="466" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">SLSA provenance</text><path d="M618 180.0 h12" stroke="#30363d" stroke-width="2" marker-end="url(#ar)"/><rect x="638" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#39c5cf" stroke-width="1.6"/><rect x="638" y="96" width="178" height="4" rx="2" fill="#39c5cf"/><text x="652" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#39c5cf">CD</text><text x="652" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">ArgoCD</text><circle cx="657" cy="178" r="2.5" fill="#39c5cf" opacity=".8"/><text x="668" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">Git = desired state</text><circle cx="657" cy="200" r="2.5" fill="#39c5cf" opacity=".8"/><text x="668" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">auto-sync + prune</text><path d="M820 180.0 h12" stroke="#30363d" stroke-width="2" marker-end="url(#ar)"/><rect x="840" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><rect x="840" y="96" width="178" height="4" rx="2" fill="#3fb950"/><text x="854" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#3fb950">Runtime</text><text x="854" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">EKS / K8s</text><circle cx="859" cy="178" r="2.5" fill="#3fb950" opacity=".8"/><text x="870" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">readiness gates</text><circle cx="859" cy="200" r="2.5" fill="#3fb950" opacity=".8"/><text x="870" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">canary 5% &#8594; 100%</text><path d="M1022 180.0 h12" stroke="#30363d" stroke-width="2" marker-end="url(#ar)"/><rect x="1042" y="96" width="178" height="168" rx="12" fill="#161b22" stroke="#f778ba" stroke-width="1.6"/><rect x="1042" y="96" width="178" height="4" rx="2" fill="#f778ba"/><text x="1056" y="130" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f778ba">Observe</text><text x="1056" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#e6edf3">OTel + DT</text><circle cx="1061" cy="178" r="2.5" fill="#f778ba" opacity=".8"/><text x="1072" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">SLI/SLO</text><circle cx="1061" cy="200" r="2.5" fill="#f778ba" opacity=".8"/><text x="1072" y="204" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">error budget</text><rect width="14" height="14" rx="3" fill="#58a6ff" opacity=".95"><animateMotion dur="6s" repeatCount="indefinite" path="M40 173.0 L1198 173.0"/></rect><path d="M1131.0 264 V298 H121.0 V264" fill="none" stroke="#f778ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar2)"/><text x="626.0" y="288" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#f778ba">burn rate &gt; 2 &#8594; rollback automático + postmortem com dados &#8594; próxima PR</text><text x="121.0" y="322" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">gate humano onde o risco é alto</text><text x="1127.0" y="322" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">métrica é o critério de sucesso da entrega</text>
</svg>
