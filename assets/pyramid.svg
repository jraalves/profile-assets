<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Pirâmide: métricas na base, logs, traces e profiling no topo; share de budget e o que cada camada responde.">
<title>Pirâmide de observabilidade com custo por camada</title><desc>Pirâmide: métricas na base, logs, traces e profiling no topo; share de budget e o que cada camada responde.</desc>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset=".5" stop-color="#bc8cff" stop-opacity=".14"/><stop offset="1" stop-color="#39c5cf" stop-opacity=".18"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="470" rx="14" fill="#0d1117"/>
<rect x=".5" y=".5" width="1279" height="469" rx="13.5" fill="none" stroke="#30363d"/>
<text x="32" y="42" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Pirâmide de observabilidade &#8594; onde cada pergunta é respondida</text><text x="32" y="64" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">largura &#8733; volume coletado &#183; topo &#8733; custo por byte &#183; o erro clássico é inverter a base</text><rect x="242.0" y="326" width="260" height="64" rx="8" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-width="1.6"/><rect x="242.0" y="326" width="260" height="64" rx="8" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0;.14;0" dur="5.9s" begin="0.00s" repeatCount="indefinite"/></rect><text x="258.0" y="353" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#bc8cff">PROFILING</text><text x="258.0" y="374" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3">por que o p99 estourou</text><text x="760" y="353" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#bc8cff">0,5%</text><text x="760" y="374" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">do budget</text><line x1="510.0" y1="360" x2="768" y2="360" stroke="#bc8cff" stroke-opacity=".28" stroke-dasharray="3 4"/><text x="800" y="366" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">contínuo, amostra baixa &#183; achado, não rotina</text><rect x="182.0" y="252" width="380" height="64" rx="8" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-width="1.6"/><rect x="182.0" y="252" width="380" height="64" rx="8" fill="#39c5cf" opacity="0"><animate attributeName="opacity" values="0;.14;0" dur="5.9s" begin="1.45s" repeatCount="indefinite"/></rect><text x="198.0" y="279" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#39c5cf">TRACES</text><text x="198.0" y="300" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3">onde a chave se perde</text><text x="760" y="279" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#39c5cf">5%</text><text x="760" y="300" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">do budget</text><line x1="570.0" y1="286" x2="768" y2="286" stroke="#39c5cf" stroke-opacity=".28" stroke-dasharray="3 4"/><text x="800" y="292" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">amostragem na cauda &#183; contexto de span</text><rect x="112.0" y="178" width="520" height="64" rx="8" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-width="1.6"/><rect x="112.0" y="178" width="520" height="64" rx="8" fill="#d29922" opacity="0"><animate attributeName="opacity" values="0;.14;0" dur="5.9s" begin="2.90s" repeatCount="indefinite"/></rect><text x="128.0" y="205" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#d29922">LOGS</text><text x="128.0" y="226" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3">o que aconteceu, com evidência</text><text x="760" y="205" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#d29922">35%</text><text x="760" y="226" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">do budget</text><line x1="640.0" y1="212" x2="768" y2="212" stroke="#d29922" stroke-opacity=".28" stroke-dasharray="3 4"/><text x="800" y="218" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">estruturado, pelo contexto &#183; nunca texto livre</text><rect x="32.0" y="104" width="680" height="64" rx="8" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-width="1.6"/><rect x="32.0" y="104" width="680" height="64" rx="8" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;.14;0" dur="5.9s" begin="4.35s" repeatCount="indefinite"/></rect><text x="48.0" y="131" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#3fb950">MÉTRICAS</text><text x="48.0" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf3">se está doendo agora</text><text x="760" y="131" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#3fb950">55%</text><text x="760" y="152" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">do budget</text><line x1="720.0" y1="138" x2="768" y2="138" stroke="#3fb950" stroke-opacity=".28" stroke-dasharray="3 4"/><text x="800" y="144" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">vocabulário fechado de labels &#183; série por SLO</text><line x1="0" y1="406" x2="744" y2="406" stroke="#30363d" stroke-width="2"/><text x="0" y="426" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">base larga: muito volume, pouco custo por byte</text><text x="744" y="426" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8b949e">topo estreito: caro, cirúrgico</text><text x="800" y="96" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#58a6ff">o que cada camada responde</text><text x="32" y="454" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">Regra prática: métrica alerta, trace localiza, log explica, profiling prova &#8594; quatro perguntas, quatro ferramentas, nenhuma descartada por preço.</text>
</svg>
