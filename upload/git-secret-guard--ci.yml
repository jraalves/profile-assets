name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao-do-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 12 casos de bloqueio/liberacao
        run: bash testa-hook.sh
      - name: o sanitizador nao pode regredir
        run: python3 -c "import ast,sys; ast.parse(open('sanitizar_repo.py').read())"
